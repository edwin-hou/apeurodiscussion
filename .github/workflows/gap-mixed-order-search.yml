name: Exact GAP mixed-order search

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {first: 129, stop: 160}
          - {first: 161, stop: 191}
          - {first: 193, stop: 224}
          - {first: 225, stop: 255}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FIRST_ORDER: ${{ matrix.first }}
      STOP_ORDER: ${{ matrix.stop }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GAP
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-smallgrp gap-character-tables
      - name: Search exact coprime actions
        shell: bash
        run: |
          cat > /tmp/search.g <<GAP
          LoadPackage("smallgrp");
          ClassPosition:=function(classes,x)
            local j; for j in [1..Length(classes)] do if x in classes[j] then return j; fi; od;
            Error("class position not found");
          end;
          FixedSubgroupOfMaps:=function(G,maps)
            return Subgroup(G,Filtered(Elements(G),g->ForAll(maps,a->Image(a,g)=g)));
          end;
          TestMaps:=function(G,maps,adesc,data)
            local perms,inv,C,Cp,cclasses,cpos,good,rhs,i,chi;
            perms:=List(maps,a->List(data.reps,r->ClassPosition(data.classes,Image(a,r))));
            inv:=Filtered(data.irr,chi->ForAll(perms,perm->ForAll([1..Length(perm)],i->chi[i]=chi[perm[i]])));
            C:=FixedSubgroupOfMaps(G,maps); Cp:=DerivedSubgroup(C); cclasses:=ConjugacyClasses(C);
            cpos:=List(cclasses,cc->ClassPosition(data.classes,Representative(cc)));
            good:=Filtered(inv,chi->ForAll(cpos,i->chi[i]<>0)); rhs:=Index(C,Cp);
            if Length(good)<>rhs then
              Print("COUNTEREXAMPLE\nG_ID=",IdGroup(G)," G_DESC=",StructureDescription(G)," G_ORDER=",Size(G),"\n");
              Print("A_DESC=",adesc," AUT_ORDER=",Size(data.aut),"\nG_GENERATORS=",GeneratorsOfGroup(G),"\n");
              for i in [1..Length(maps)] do Print("A_GEN ",i," ORDER=",Order(maps[i])," IMAGES=",List(GeneratorsOfGroup(G),g->Image(maps[i],g)),"\n"); od;
              Print("C_ORDER=",Size(C)," C_DESC=",StructureDescription(C)," C_GENS=",GeneratorsOfGroup(C),"\n");
              Print("CP_ORDER=",Size(Cp)," CP_GENS=",GeneratorsOfGroup(Cp)," RHS=",rhs,"\n");
              Print("C_CLASS_REPS=",List(cclasses,Representative),"\nC_TO_G_CLASS_POS=",cpos,"\n");
              Print("INVARIANT_COUNT=",Length(inv)," GOOD_COUNT=",Length(good),"\n");
              for i in [1..Length(inv)] do chi:=inv[i]; Print("INVCHAR ",i," DEG=",chi[1]," CVALUES=",chi{cpos}," ALLVALUES=",chi," GOOD=",ForAll(cpos,j->chi[j]<>0),"\n"); od;
              return true;
            fi; return false;
          end;
          SearchGroup:=function(G)
            local aut,classes,data,sclasses,sc,A,aclasses,ac,a,checked;
            aut:=AutomorphismGroup(G); classes:=ConjugacyClasses(G);
            data:=rec(aut:=aut,classes:=classes,reps:=List(classes,Representative),irr:=Irr(G)); checked:=0;
            if Size(aut)<=250000 then
              sclasses:=ConjugacyClassesSubgroups(aut);
              for sc in sclasses do A:=Representative(sc);
                if Size(A)>1 and Gcd(Size(A),Size(G))=1 then checked:=checked+1;
                  if TestMaps(G,GeneratorsOfGroup(A),Concatenation(StructureDescription(A)," order ",String(Size(A))),data) then return [true,checked]; fi;
                fi;
              od;
            elif Size(aut)<=5000000 then
              aclasses:=ConjugacyClasses(aut);
              for ac in aclasses do a:=Representative(ac);
                if Order(a)>1 and Gcd(Order(a),Size(G))=1 then checked:=checked+1;
                  if TestMaps(G,[a],Concatenation("cyclic order ",String(Order(a))),data) then return [true,checked]; fi;
                fi;
              od;
            fi; return [false,checked];
          end;
          firstorder:=$FIRST_ORDER; stoporder:=$STOP_ORDER; actions:=0;
          Print("GAP_VERSION=",GAPInfo.Version," RANGE=",firstorder,"..",stoporder,"\n");
          for n in [firstorder..stoporder] do
            if SmallGroupsAvailable(n) then
              Print("ORDER_START ",n," GROUPS=",NumberSmallGroups(n),"\n");
              for id in [1..NumberSmallGroups(n)] do G:=SmallGroup(n,id);
                if not IsAbelian(G) then res:=SearchGroup(G); actions:=actions+res[2];
                  if res[1] then Print("SEARCH_COMPLETED_WITH_COUNTEREXAMPLE\n"); QUIT_GAP(0); fi;
                fi;
              od;
              Print("ORDER_DONE ",n," TOTAL_ACTIONS=",actions,"\n");
            fi;
          od;
          Print("NO_COUNTEREXAMPLE RANGE=",firstorder,"..",stoporder," ACTIONS=",actions,"\nSEARCH_COMPLETED\n");
          QUIT_GAP(0);
          GAP
          gap -q -b /tmp/search.g 2>&1 | tee /tmp/gap.log
          grep -q '^SEARCH_COMPLETED' /tmp/gap.log
          ! grep -q '^Error,' /tmp/gap.log
