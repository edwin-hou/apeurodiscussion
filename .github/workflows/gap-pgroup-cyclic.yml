name: Exact cyclic actions on p-groups

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {order: 128, first: 1, stop: 150, prime: 2}
          - {order: 128, first: 151, stop: 300, prime: 2}
          - {order: 128, first: 301, stop: 450, prime: 2}
          - {order: 128, first: 451, stop: 600, prime: 2}
          - {order: 128, first: 601, stop: 750, prime: 2}
          - {order: 128, first: 751, stop: 900, prime: 2}
          - {order: 128, first: 901, stop: 1050, prime: 2}
          - {order: 128, first: 1051, stop: 1200, prime: 2}
          - {order: 128, first: 1201, stop: 1350, prime: 2}
          - {order: 128, first: 1351, stop: 1500, prime: 2}
          - {order: 128, first: 1501, stop: 1650, prime: 2}
          - {order: 128, first: 1651, stop: 1800, prime: 2}
          - {order: 128, first: 1801, stop: 1950, prime: 2}
          - {order: 128, first: 1951, stop: 2100, prime: 2}
          - {order: 128, first: 2101, stop: 2220, prime: 2}
          - {order: 128, first: 2221, stop: 2328, prime: 2}
          - {order: 243, first: 1, stop: 67, prime: 3}
          - {order: 625, first: 1, stop: 15, prime: 5}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GROUP_ORDER: ${{ matrix.order }}
      FIRST_ID: ${{ matrix.first }}
      STOP_ID: ${{ matrix.stop }}
      GROUP_PRIME: ${{ matrix.prime }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GAP
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-smallgrp gap-character-tables
      - name: Search all coprime cyclic classes
        shell: bash
        run: |
          cat > /tmp/search.g <<GAP
          LoadPackage("smallgrp");
          ClassPosition:=function(classes,x)
            local j; for j in [1..Length(classes)] do if x in classes[j] then return j; fi; od;
            Error("class position not found");
          end;
          TestAutomorphism:=function(G,a,data)
            local perm,inv,C,Cp,cclasses,cpos,good,rhs,i,chi;
            perm:=List(data.reps,r->ClassPosition(data.classes,Image(a,r)));
            inv:=Filtered(data.irr,chi->ForAll([1..Length(perm)],i->chi[i]=chi[perm[i]]));
            C:=Subgroup(G,Filtered(Elements(G),g->Image(a,g)=g)); Cp:=DerivedSubgroup(C);
            cclasses:=ConjugacyClasses(C); cpos:=List(cclasses,cc->ClassPosition(data.classes,Representative(cc)));
            good:=Filtered(inv,chi->ForAll(cpos,i->chi[i]<>0)); rhs:=Index(C,Cp);
            if Length(good)<>rhs then
              Print("COUNTEREXAMPLE\nG_ID=",IdGroup(G)," G_DESC=",StructureDescription(G)," G_ORDER=",Size(G),"\n");
              Print("AUT_ORDER=",Order(a)," AUT_GROUP_ORDER=",Size(data.aut),"\nG_GENERATORS=",GeneratorsOfGroup(G),"\n");
              Print("AUT_IMAGES=",List(GeneratorsOfGroup(G),g->Image(a,g)),"\n");
              Print("C_ORDER=",Size(C)," C_DESC=",StructureDescription(C)," C_GENS=",GeneratorsOfGroup(C),"\n");
              Print("CP_ORDER=",Size(Cp)," CP_GENS=",GeneratorsOfGroup(Cp)," RHS=",rhs,"\n");
              Print("C_CLASS_REPS=",List(cclasses,Representative),"\nC_TO_G_CLASS_POS=",cpos,"\n");
              Print("INVARIANT_COUNT=",Length(inv)," GOOD_COUNT=",Length(good),"\n");
              for i in [1..Length(inv)] do chi:=inv[i]; Print("INVCHAR ",i," DEG=",chi[1]," CVALUES=",chi{cpos}," ALLVALUES=",chi," GOOD=",ForAll(cpos,j->chi[j]<>0),"\n"); od;
              return true;
            fi; return false;
          end;
          n:=$GROUP_ORDER; firstid:=$FIRST_ID; stopid:=$STOP_ID; p:=$GROUP_PRIME; actions:=0;
          Print("GAP_VERSION=",GAPInfo.Version," ORDER=",n," IDS=",firstid,"..",stopid,"\n");
          for id in [firstid..stopid] do
            G:=SmallGroup(n,id);
            if not IsAbelian(G) then
              aut:=AutomorphismGroup(G); classes:=ConjugacyClasses(G);
              data:=rec(aut:=aut,classes:=classes,reps:=List(classes,Representative),irr:=Irr(G));
              for ac in ConjugacyClasses(aut) do a:=Representative(ac);
                if Order(a)>1 and Gcd(Order(a),n)=1 then actions:=actions+1;
                  if TestAutomorphism(G,a,data) then Print("SEARCH_COMPLETED_WITH_COUNTEREXAMPLE\n"); QUIT_GAP(0); fi;
                fi;
              od;
            fi;
            if id mod 25=0 then Print("PROGRESS ID=",id," ACTIONS=",actions,"\n"); fi;
          od;
          Print("NO_COUNTEREXAMPLE ORDER=",n," IDS=",firstid,"..",stopid," ACTIONS=",actions,"\nSEARCH_COMPLETED\n");
          QUIT_GAP(0);
          GAP
          gap -q -b /tmp/search.g 2>&1 | tee /tmp/gap.log
          grep -q '^SEARCH_COMPLETED' /tmp/gap.log
          ! grep -q '^Error,' /tmp/gap.log
