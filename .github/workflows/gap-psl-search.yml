name: Exact PSL2 subfield-action certificate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install GAP
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-character-tables gap-atlasrep
      - name: Certify PSL2(243) field action
        shell: bash
        run: |
          cat > /tmp/cert.g <<'GAP'
          ClassPosition := function(classes,x)
            local j;
            for j in [1..Length(classes)] do
              if x in classes[j] then return j; fi;
            od;
            Error("class position not found");
          end;

          Print("GAP_VERSION=",GAPInfo.Version,"\n");
          G:=PSL(2,243);
          aut:=AutomorphismGroup(G);
          P:=SylowSubgroup(aut,5);
          a:=First(Elements(P),x->Order(x)=5);
          s:=ConjugatorOfConjugatorIsomorphism(a);
          Print("G_ORDER=",Size(G)," AUT_ORDER=",Size(aut)," A_ORDER=",Order(a),"\n");
          Print("CONJUGATOR_ORDER=",Order(s)," NORMALIZES=",G^s=G,"\n");

          C:=Centralizer(G,s);
          Cp:=DerivedSubgroup(C);
          Print("C_ORDER=",Size(C)," C_DESC=",StructureDescription(C)," CP_ORDER=",Size(Cp)," RHS=",Index(C,Cp),"\n");
          Print("C_GENS=",GeneratorsOfGroup(C)," CP_GENS=",GeneratorsOfGroup(Cp),"\n");

          classes:=ConjugacyClasses(G);
          reps:=List(classes,Representative);
          perm:=List(reps,r->ClassPosition(classes,Image(a,r)));
          irr:=Irr(G);
          invpos:=Filtered([1..Length(irr)],k->ForAll([1..Length(perm)],j->irr[k][j]=irr[k][perm[j]]));
          cclasses:=ConjugacyClasses(C);
          creps:=List(cclasses,Representative);
          cpos:=List(creps,r->ClassPosition(classes,r));
          goodpos:=Filtered(invpos,k->ForAll(cpos,j->irr[k][j]<>0));

          Print("G_CLASSES=",Length(classes)," INV_POS=",invpos," INV_DEGREES=",List(invpos,k->irr[k][1]),"\n");
          Print("C_CLASS_REPS=",creps," C_CLASS_ORDERS=",List(creps,Order)," C_TO_G=",cpos,"\n");
          Print("GOOD_POS=",goodpos," GOOD_COUNT=",Length(goodpos)," RHS=",Index(C,Cp),"\n");
          for k in invpos do
            Print("INVCHAR_POS=",k," DEG=",irr[k][1]," CVALUES=",irr[k]{cpos}," GOOD=",k in goodpos,"\n");
          od;
          if Length(goodpos)<>Index(C,Cp) then
            Print("COUNTEREXAMPLE_CERTIFIED\n");
          else
            Print("IDENTITY_CERTIFIED_FOR_ACTION\n");
          fi;
          Print("CERT_COMPLETED\n");
          QUIT_GAP(0);
          GAP
          gap -q -b /tmp/cert.g 2>&1 | tee /tmp/cert.log
          grep -q '^CERT_COMPLETED' /tmp/cert.log
          ! grep -q '^Error,' /tmp/cert.log